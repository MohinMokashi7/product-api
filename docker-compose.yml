services:

  mysql:
    image: mysql:8.0
    container_name: product-api-mysql
    environment:
      MYSQL_ROOT_PASSWORD: student
      MYSQL_DATABASE: product_api_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pstudent"]
      timeout: 5s
      retries: 10

  product-api:
    build: .
    container_name: product-api
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/product_api_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: student
      JWT_SECRET: VGhpc0lzQVN1ZmZpY2llbnRseUxvbmdTZWNyZXRLZXlGb3JaZXN0
      JWT_EXPIRATION: 900000
      JWT_REFRESH_EXPIRATION: 604800000
    ports:
      - "8080:8080"

volumes:
  mysql_data: